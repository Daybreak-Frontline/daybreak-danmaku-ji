<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      html {
        opacity: 0;
      }
      html,
      body,
      #app {
        overflow: hidden;
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      html.is-overlay,
      html.is-overlay body,
      html.is-overlay #app {
        opacity: 1;
        background: transparent !important;
      }
    </style>
    <script>
      if (/\/overlay(\/|$)/.test(location.pathname)) {
        document.documentElement.classList.add('is-overlay');
        document.documentElement.style.opacity = '1';
        document.documentElement.style.background = 'transparent';
      } else if (
        ('standalone' in window.navigator && window.navigator.standalone) ||
        window.matchMedia('(display-mode: standalone)').matches
      ) {
        var backStyle = document.createElement('style');
        backStyle.innerHTML = `body {background-color: white;}`;
        document.head.appendChild(backStyle);
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/zhuzhan.svg" />
    <link rel="icon" type="image/png" href="/zhuzhan.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>弹幕点歌姬</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
